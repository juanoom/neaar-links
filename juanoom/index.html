<script>

const faqContainer = document.querySelector('.faq');
faqContainer.addEventListener('click', (event) => {
  const item = event.target.closest('.faq-item');
  if (item) {
    const answer = item.querySelector('.faq-answer');
    const allAnswers = document.querySelectorAll('.faq-answer');
    const allItems = document.querySelectorAll('.faq-item');

    // Close all other answers
    allAnswers.forEach(a => {
      if (a !== answer) {
        a.classList.remove('active');
        a.style.display = 'none';
      }
    });
    allItems.forEach(i => {
      if (i !== item) {
        i.classList.remove('active');
      }
    });

    // Toggle current answer
    if (answer) {
      answer.classList.toggle('active');
      item.classList.toggle('active');
      answer.style.display = answer.classList.contains('active') ? 'block' : 'none';
    }
  }
});

  // Funcionalidad del botón de compartir
  const shareButton = document.getElementById('shareButton');

  const sharePopup = document.getElementById('sharePopup');
  const closePopup = document.getElementById('closePopup');

  shareButton.addEventListener('click', () => {
    sharePopup.style.display = 'flex';
  });

  closePopup.addEventListener('click', () => {

    if (event.target === sharePopup) {
      sharePopup.style.display = 'none';

<script>
const cursor = document.querySelector('.cursor');
const interactiveElements = document.querySelectorAll('a, button, [role="button"], .faq-item');

document.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX - (cursor.offsetWidth / 2) + 'px';
    cursor.style.top = e.clientY - (cursor.offsetHeight / 2) + 'px';
});

interactiveElements.forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
});

document.addEventListener('mousedown', () => cursor.classList.add('hover'));
document.addEventListener('mouseup', () => cursor.classList.remove('hover'));
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const mainContent = document.querySelector('body > *:not(.cursor)');
        
        // Replace elements with data-dynamic attribute
        document.querySelectorAll('[data-dynamic]').forEach(element => {
            const key = element.getAttribute('data-dynamic');
            if (element.tagName === 'TITLE' || element.tagName === 'META') {
                const content = element.getAttribute('content') || element.textContent;
                const newContent = content.replace(/\{\{(\w+)\}\}/g, (_, key) => userData[key] || '');
                if (element.tagName === 'META') {
                    element.setAttribute('content', newContent);
                } else {
                    element.textContent = newContent;
                }
            } else {
                element.textContent = userData[key] || '';
            }
        });

        // Replace {{variables}} only within the main content
        if (mainContent) {
            mainContent.innerHTML = mainContent.innerHTML.replace(
                /\{\{(\w+)\}\}/g,
                (_, key) => userData[key] || ''
            );
        }
    });
    document.querySelectorAll('[data-dynamic]').forEach(element => {
    const key = element.getAttribute('data-dynamic');
    if (key === 'description') {
        element.innerHTML = userData[key].replace(/\n/g, '<br>');
    } else {
        element.textContent = userData[key] || '';
    }
});

</script>
